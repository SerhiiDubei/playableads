  #stage{position:absolute;left:50%;top:50%;width:400px;height:860px;
    transform:translate(-50%,-50%);transform-origin:center center;will-change:transform}
  
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"Cinzel",Georgia,serif}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    padding:84px 24px 28px;opacity:0;visibility:hidden;transform:translateY(16px);
    transition:opacity .28s ease,transform .28s ease}
  .screen.active{opacity:1;visibility:visible;transform:none}
  .title{color:#ffe9b0;font-family:"Cinzel",Georgia,serif;font-weight:700;letter-spacing:1px;font-size:30px;text-align:center;
    text-shadow:0 2px 0 #3a2208,0 0 18px #c9962f55}
  .sub{color:#d8c49a;font-size:13px}
  .topbar{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;z-index:5}
  .stack{display:flex;flex-direction:column;align-items:stretch;gap:13px;width:320px}
  .knight{height:360px;filter:drop-shadow(0 8px 12px #0009)}
  #stage .c-banner{max-width:344px}

  .gold{color:#f7ead0;text-shadow:0 1px 0 #6b4a1e,0 2px 3px rgba(0,0,0,.55)}
  .k-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

  .c-banner{position:relative;width:100%;max-width:340px;aspect-ratio:340/122;margin:0 auto}
  .c-banner img{width:100%;display:block;filter:drop-shadow(0 4px 6px #0008)}
  .c-banner .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Cinzel",Georgia,serif;
    font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:24px;padding-bottom:8%}
