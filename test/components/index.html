  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Cinzel",Georgia,serif;color:#f7ead0;
    background:radial-gradient(120% 120% at 50% 0%,#6b4a22,#2c1d0c 70%,#160f06);min-height:100vh;padding:24px}
  h2{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#c9a86a;margin:26px 0 12px;border-bottom:1px solid #c9962f33;padding-bottom:6px}
  .wrap{max-width:460px;margin:0 auto}
  .sub{color:#cbb78d;font-size:13px}
  .stack{display:flex;flex-direction:column;align-items:stretch;gap:12px}

  .gold{color:#f7ead0;text-shadow:0 1px 0 #6b4a1e,0 2px 3px rgba(0,0,0,.55)}
  .k-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

  .c-banner{position:relative;width:100%;max-width:340px;aspect-ratio:340/191;margin:0 auto}
  .c-banner img{width:100%;display:block;filter:drop-shadow(0 4px 6px #0008)}
  .c-banner .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Cinzel",Georgia,serif;
